<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Her Elegance | Women's Formal Wear</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
        /* --- CSS VARIABLES & RESET --- */
        :root {
            --primary-gold: #d4af37;
            --primary-gold-hover: #b4932a;
            --dark-bg: #0a0a0a;
            --card-bg: #151515;
            --text-light: #f0f0f0;
            --text-gray: #b0b0b0;
            --success: #c5a059;
            --font-heading: 'Playfair Display', serif;
            --font-body: 'Lato', sans-serif;
            --transition: all 0.3s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-body);
            background-color: var(--dark-bg);
            color: var(--text-light);
            line-height: 1.6;
            overflow-x: hidden;
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

        /* --- BUTTONS --- */
        .btn {
            display: inline-block;
            padding: 12px 24px;
            border: 1px solid var(--primary-gold);
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: var(--transition);
            background: transparent;
            color: var(--primary-gold);
        }

        .btn-gold {
            background: var(--primary-gold);
            color: #000;
        }

        .btn-gold:hover { 
            background: var(--primary-gold-hover); 
            transform: translateY(-2px); 
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.3);
        }

        .btn-outline.active {
            background: var(--primary-gold);
            color: #000;
        }
        
        .btn-outline:hover {
            background: rgba(212, 175, 55, 0.1);
        }

        /* --- HEADER --- */
        header {
            background-color: rgba(10, 10, 10, 0.95);
            padding: 20px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
        }

        nav { display: flex; justify-content: space-between; align-items: center; }

        .logo {
            font-family: var(--font-heading);
            font-size: 2rem;
            color: var(--primary-gold);
            font-weight: bold;
            text-decoration: none;
            font-style: italic;
        }

        .cart-icon-wrapper { position: relative; cursor: pointer; }
        .cart-count {
            position: absolute; top: -8px; right: -8px;
            background-color: var(--primary-gold); color: #000;
            font-size: 0.8rem; width: 20px; height: 20px;
            border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold;
        }

        /* --- HERO --- */
        .hero {
            height: 60vh;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1483985988355-763728e1935b?q=80&w=1920&auto=format&fit=crop') no-repeat center center/cover;
            display: flex; align-items: center; justify-content: center; text-align: center;
        }
        .hero h1 { font-family: var(--font-heading); font-size: 3.5rem; color: #fff; margin-bottom: 15px; text-shadow: 2px 2px 4px #000; }
        .hero p { font-size: 1.2rem; color: #ddd; letter-spacing: 1px; }

        /* --- FILTER TABS --- */
        .filters {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin: 50px 0 30px 0;
            border-bottom: 1px solid #333;
            padding-bottom: 20px;
        }

        /* --- PRODUCTS GRID --- */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 30px;
            padding-bottom: 80px;
        }

        .product-card {
            background-color: var(--card-bg);
            border: 1px solid #2a2a2a;
            border-radius: 4px;
            overflow: hidden;
            transition: var(--transition);
            position: relative;
        }

        .product-card:hover { 
            transform: translateY(-5px); 
            border-color: var(--primary-gold);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .product-img {
            width: 100%;
            height: 320px;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .product-card:hover .product-img {
            transform: scale(1.05);
        }

        .product-info { padding: 20px; text-align: center; background: linear-gradient(to top, #1a1a1a, #151515); }
        
        .product-category { 
            font-size: 0.75rem; 
            color: var(--text-gray); 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            margin-bottom: 8px;
            display: block;
        }
        
        .product-title { 
            font-family: var(--font-heading); 
            font-size: 1.25rem; 
            margin-bottom: 10px; 
            color: #fff;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .product-price { 
            color: var(--primary-gold); 
            font-weight: bold; 
            font-size: 1.1rem;
            margin-bottom: 15px;
        }

        /* --- ADMIN TABLE --- */
        #admin-panel { display: none; padding: 80px 0; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: var(--card-bg); }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #333; }
        th { background: #222; color: var(--primary-gold); text-transform: uppercase; font-size: 0.85rem; letter-spacing: 1px; }
        .city-badge { background: #222; color: #fff; padding: 4px 10px; border-radius: 2px; font-size: 0.85rem; border: 1px solid var(--primary-gold); }

        /* --- MODALS --- */
        .modal {
            display: none; position: fixed; z-index: 2000; left: 0; top: 0;
            width: 100%; height: 100%; background: rgba(0,0,0,0.9);
            align-items: center; justify-content: center;
        }
        .modal-content {
            background: var(--card-bg); width: 90%; max-width: 500px; padding: 30px;
            border: 1px solid var(--primary-gold); border-radius: 4px; max-height: 90vh; overflow-y: auto;
        }
        .close-modal { position: absolute; top: 15px; right: 20px; font-size: 1.5rem; cursor: pointer; color: var(--primary-gold); }
        .cart-item { display: flex; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid #333; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: var(--text-gray); font-size: 0.9rem; }
        .form-group input, .form-group textarea {
            width: 100%; padding: 12px; background: #0a0a0a;
            border: 1px solid #444; color: white; border-radius: 2px; font-family: var(--font-body);
        }
        .form-group input:focus { outline: none; border-color: var(--primary-gold); }

        /* --- TOAST --- */
        #toast-container { position: fixed; bottom: 30px; right: 30px; z-index: 3000; }
        .toast {
            background: var(--card-bg); color: #fff; padding: 15px 25px;
            margin-top: 10px; border-left: 3px solid var(--primary-gold);
            box-shadow: 0 5px 20px rgba(0,0,0,0.6); animation: slideIn 0.3s ease-out; font-size: 0.95rem;
        }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }

        footer { text-align: center; padding: 50px 0; border-top: 1px solid #222; margin-top: 50px; color: #666; font-size: 0.9rem; }
        .admin-toggle {
            background: transparent; border: 1px solid #333; color: #555; padding: 8px 15px; cursor: pointer; margin-top: 20px; transition: 0.3s;
        }
        .admin-toggle:hover { color: var(--primary-gold); border-color: var(--primary-gold); }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            .hero h1 { font-size: 2.2rem; }
            .filters { gap: 10px; }
            .btn { padding: 10px 15px; font-size: 0.8rem; }
            .product-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
            .product-img { height: 220px; }
            .product-title { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="container">
            <nav>
                <a href="#" class="logo" onclick="showShop()">Her Elegance</a>
                <div class="nav-icons">
                    <div class="cart-icon-wrapper" onclick="openCart()">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
                        <span class="cart-count" id="cart-count">0</span>
                    </div>
                </div>
            </nav>
        </div>
    </header>

    <!-- Hero -->
    <section class="hero" id="shop">
        <div class="container">
            <h1>For Her</h1>
            <p>Exclusive Formal Collection for Women</p>
        </div>
    </section>

    <!-- Products Area -->
    <section class="container">
        <!-- Category Filters -->
        <div class="filters" id="filter-container">
            <!-- Filters injected via JS -->
        </div>

        <div class="product-grid" id="product-grid">
            <!-- Products injected via JS -->
        </div>
    </section>

    <!-- Admin Dashboard -->
    <section class="container" id="admin-panel">
        <h2 style="color:var(--primary-gold); font-family:var(--font-heading); text-align:center; margin-bottom:30px; font-size:2.5rem;">Admin Dashboard</h2>
        <div style="overflow-x:auto; box-shadow: 0 10px 30px rgba(0,0,0,0.3);">
            <table id="orders-table">
                <thead>
                    <tr>
                        <th>Order ID</th>
                        <th>Customer Name</th>
                        <th>City</th>
                        <th>Items</th>
                        <th>Total</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="orders-tbody"></tbody>
            </table>
        </div>
        <div style="text-align:center; margin-top:40px;">
            <button class="btn btn-gold" onclick="showShop()">Back to Store</button>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p>&copy; 2023 Her Elegance. Women's Luxury.</p>
            <button class="admin-toggle" onclick="toggleAdmin()">Admin Access</button>
        </div>
    </footer>

    <!-- Cart Modal -->
    <div id="cart-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeCart()">&times;</span>
            <h3 style="color:var(--primary-gold); margin-bottom:25px; font-family:var(--font-heading); font-size:1.8rem; text-align:center;">Your Cart</h3>
            <div id="cart-items"></div>
            <div style="margin-top:25px; display:flex; justify-content:space-between; font-weight:bold; color:var(--primary-gold); font-size:1.2rem; border-top:1px solid #333; padding-top:15px;">
                <span>Total:</span>
                <span id="cart-total-price">PKR 0</span>
            </div>
            <div style="margin-top:25px; text-align:center;">
                <button class="btn btn-gold" style="width:100%;" onclick="openCheckout()">Proceed to Checkout</button>
            </div>
        </div>
    </div>

    <!-- Checkout Modal -->
    <div id="checkout-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeCheckout()">&times;</span>
            <h3 style="color:var(--primary-gold); margin-bottom:25px; font-family:var(--font-heading); text-align:center;">Checkout</h3>
            <form id="checkout-form" onsubmit="handleCheckout(event)">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="cust-name" required placeholder="Your Name">
                </div>
                <div class="form-group">
                    <label>City</label>
                    <input type="text" id="cust-city" required placeholder="City Name">
                </div>
                <div class="form-group">
                    <label>Shipping Address</label>
                    <textarea id="cust-address" rows="3" required placeholder="Full Address"></textarea>
                </div>
                <button type="submit" class="btn btn-gold" style="width:100%;">Confirm Order</button>
            </form>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container"></div>

    <!-- JAVASCRIPT -->
    <script>
        // --- 1. DATA: WOMEN'S FORMAL ONLY ---
        
        const products = [
            // --- EASTERN WEAR (WOMEN) ---
            { id: 101, name: "Emerald Green Silk Kurta", category: "eastern", price: 5500, image: "imag1.jpg" },
            { id: 102, name: "Beige Embroidered Kaftan", category: "eastern", price: 6500, image: "imag2.jpg" },
            { id: 103, name: "Peach Chiffon Dupatta Set", category: "eastern", price: 4800, image: "imag3.jpg" },
            { id: 104, name: "Navy Blue Trouser Suit", category: "eastern", price: 6200, image: "imag4.jpg" },
            { id: 105, name: "Black Formal Anarkali", category: "eastern", price: 7500, image: "imag5.jpg" },
            { id: 106, name: "Ivory Straight Suit", category: "eastern", price: 5800, image: "imag6.jpg" },
            { id: 107, name: "Maroon Digital Print Suit", category: "eastern", price: 4500, image: "imag7.jpg" },
            { id: 108, name: "Pastel Long Shirt", category: "eastern", price: 5000, image: "imag8.jpg" },
            { id: 109, name: "Grey Palazzo Set", category: "eastern", price: 5200, image: "imag9.webp" },
            { id: 110, name: "White Lawn Kurta", category: "eastern", price: 3500, image:"imag10.jpg" },

            // --- WESTERN WEAR (WOMEN) ---
            { id: 201, name: "Classic Black Blazer", category: "western", price: 8500, image: "imag11.jpg" },
            { id: 202, name: "White Formal Shirt", category: "western", price: 2800, image: "imag12.jpg" },
            { id: 203, name: "Beige Trousers", category: "western", price: 3200, image: "imag13.jpg" },
            { id: 204, name: "Black Pencil Skirt", category: "western", price: 2500, image: "imag14.jpg" },
            { id: 205, name: "Office Sheath Dress", category: "western", price: 4500, image: "imag15.jpg" },
            { id: 206, name: "Navy Blue Jumpsuit", category: "western", price: 5500, image: "imag16.jpg" },
            { id: 207, name: "Satin Blouse Nude", category: "western", price: 2200, image: "imag17.jpg" },
            { id: 208, name: "Grey Trench Coat", category: "western", price: 9500, image: "imag18.jpg" },
            { id: 209, name: "Pleated Midi Skirt", category: "western", price: 4000, image: "imag19.jpg" },
            { id: 210, name: "Pinstripe Pants", category: "western", price: 3800, image: "imag20.jpg" },

            // --- JEWELLERY (WOMEN) ---
            { id: 301, name: "Gold Jhumka Earrings", category: "jewellery", price: 1200000, image: "imag21.jpg" },
            { id: 302, name: "Pearl Drop Necklace", category: "jewellery", price: 7800, image: "imag22.jpg" },
            { id: 303, name: "Diamond Solitaire Ring", category: "jewellery", price: 1900000, image: "imag23.jpg" },
            { id: 304, name: "Crystal Pendant Set", category: "jewellery", price: 5500, image: "imag24.jpg" },
            { id: 305, name: "Rose Gold Ladies Watch", category: "jewellery", price: 800000, image: "imag25.jpg" },
            { id: 306, name: "Silver Charm Bracelet", category: "jewellery", price: 4000, image: "imag40.jpg" },
            { id: 307, name: "Kundan Light Choker", category: "jewellery", price: 6500, image:"imag26.jpg" },
            { id: 308, name: "Hoop Earrings Gold", category: "jewellery", price: 600000, image: "imag27.jpg" },
            { id: 309, name: "Ruby Stone Ring", category: "jewellery", price: 900000, image: "imag28.jpg" },
            { id: 310, name: "Elegant Silver Bangles", category: "jewellery", price: 17000, image: "imag29.jpg" },

            // --- SHOES & BAGS (WOMEN) ---
            { id: 401, name: "Black Stilettos", category: "accessories", price: 6500, image: "imag30.jpg" },
            { id: 402, name: "Nude Pumps", category: "accessories", price: 5500, image: "imag31.jpg" },
            { id: 403, name: "Gold Block Heels", category: "accessories", price: 4800, image: "imag32.jpg" },
            { id: 404, name: "Black Clutch Bag", category: "accessories", price: 4500, image: "imag33.jpg" },
            { id: 405, name: "Beige Tote Handbag", category: "accessories", price: 3500, image: "imag34.jpg" },
            { id: 406, name: "Maroon Suede Heels", category: "accessories", price: 5200, image: "imag35.jpg" },
            { id: 407, name: "Thin Leather Belt", category: "accessories", price: 3800, image: "imag36.jpg" },
            { id: 408, name: "Cat Eye Sunglasses", category: "accessories", price: 2500, image: "imag37.jpg" },
            { id: 409, name: "Silk Scarf", category: "accessories", price: 800, image: "imag38.jpg" },
            { id: 410, name: "Ballet Flats Black", category: "accessories", price: 4700, image: "imag39.jpg" }
        ];

        const categories = [
            { id: 'all', name: 'All Collection' },
            { id: 'eastern', name: 'Eastern Wear' },
            { id: 'western', name: 'Western Wear' },
            { id: 'jewellery', name: 'Jewellery' },
            { id: 'accessories', name: 'Shoes & Bags' }
        ];

        // --- 2. STATE MANAGEMENT ---
        let cart = JSON.parse(localStorage.getItem('luxeCart')) || [];
        let orders = JSON.parse(localStorage.getItem('luxeOrders')) || [];
        let activeFilter = 'all';

        // --- 3. INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', () => {
            renderFilters();
            renderProducts('all');
            updateCartCount();
            renderAdminOrders();
        });

        // --- 4. RENDER FUNCTIONS ---
        function renderFilters() {
            const container = document.getElementById('filter-container');
            container.innerHTML = categories.map(cat => `
                <button class="btn btn-outline ${cat.id === 'all' ? 'active' : ''}" 
                        onclick="filterProducts('${cat.id}', this)">
                    ${cat.name}
                </button>
            `).join('');
        }

        function renderProducts(filterId) {
            activeFilter = filterId;
            const grid = document.getElementById('product-grid');
            const filteredData = filterId === 'all' 
                ? products 
                : products.filter(p => p.category === filterId);

            if(filteredData.length === 0) {
                 grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #777;">No products found.</p>';
                 return;
            }

            grid.innerHTML = filteredData.map(product => `
                <div class="product-card">
                    <div style="overflow:hidden;">
                        <img src="${product.image}" alt="${product.name}" class="product-img" loading="lazy">
                    </div>
                    <div class="product-info">
                        <span class="product-category">${categories.find(c=>c.id === product.category).name}</span>
                        <h3 class="product-title">${product.name}</h3>
                        <div class="product-price">PKR ${product.price.toLocaleString()}</div>
                        <button class="btn btn-outline" style="width:100%;" onclick="addToCart(${product.id})">Add to Cart</button>
                    </div>
                </div>
            `).join('');
        }

        function filterProducts(catId, btnElement) {
            document.querySelectorAll('.filters .btn').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');
            renderProducts(catId);
        }

        // --- 5. CART LOGIC ---
        function addToCart(id) {
            const product = products.find(p => p.id === id);
            cart.push(product);
            saveCart();
            updateCartCount();
            showToast(`Added: ${product.name}`);
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            saveCart();
            renderCartItems();
            updateCartCount();
        }

        function saveCart() {
            localStorage.setItem('luxeCart', JSON.stringify(cart));
        }

        function updateCartCount() {
            document.getElementById('cart-count').innerText = cart.length;
        }

        function renderCartItems() {
            const container = document.getElementById('cart-items');
            const totalEl = document.getElementById('cart-total-price');
            
            if (cart.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#777; padding:20px;">Your cart is empty.</p>';
                totalEl.innerText = 'PKR 0';
                return;
            }

            let total = 0;
            container.innerHTML = cart.map((item, index) => {
                total += item.price;
                return `
                <div class="cart-item">
                    <div style="display:flex; align-items:center; gap:10px;">
                        <img src="${item.image}" style="width:40px; height:40px; object-fit:cover; border-radius:2px;">
                        <div>
                            <div style="font-weight:bold; font-size:0.9rem; color:#fff;">${item.name}</div>
                            <small style="color:#aaa;">PKR ${item.price.toLocaleString()}</small>
                        </div>
                    </div>
                    <button onclick="removeFromCart(${index})" style="background:none; border:none; color:#d4af37; cursor:pointer; font-size:1.2rem;">&times;</button>
                </div>`;
            }).join('');
            totalEl.innerText = 'PKR ' + total.toLocaleString();
        }

        // --- 6. CHECKOUT & ADMIN ---
        function handleCheckout(e) {
            e.preventDefault();
            if (cart.length === 0) return showToast("Cart is empty!", "error");

            const name = document.getElementById('cust-name').value;
            const city = document.getElementById('cust-city').value;
            const address = document.getElementById('cust-address').value;

            const newOrder = {
                id: Date.now(),
                customerName: name,
                city: city,
                address: address,
                items: [...cart],
                total: cart.reduce((sum, i) => sum + i.price, 0),
                date: new Date().toLocaleDateString()
            };

            orders.push(newOrder);
            localStorage.setItem('luxeOrders', JSON.stringify(orders));

            cart = [];
            saveCart();
            updateCartCount();
            closeCheckout();
            closeCart();
            showToast("Order placed successfully!");
            renderAdminOrders();
            document.getElementById('checkout-form').reset();
        }

        function renderAdminOrders() {
            const tbody = document.getElementById('orders-tbody');
            if (orders.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:30px;">No orders found.</td></tr>';
                return;
            }

            tbody.innerHTML = orders.slice().reverse().map(order => `
                <tr>
                    <td>#${order.id}</td>
                    <td>
                        <strong>${order.customerName}</strong><br>
                        <small style="color:#777;">${order.date}</small>
                    </td>
                    <td><span class="city-badge">${order.city}</span></td>
                    <td>${order.items.length} Items</td>
                    <td style="color:var(--primary-gold); font-weight:bold;">PKR ${order.total.toLocaleString()}</td>
                    <td style="color:var(--success);">Confirmed</td>
                </tr>
            `).join('');
        }

        // --- 7. UTILS & NAVIGATION ---
        function openCart() { renderCartItems(); document.getElementById('cart-modal').style.display = 'flex'; }
        function closeCart() { document.getElementById('cart-modal').style.display = 'none'; }
        function openCheckout() { 
            if(cart.length === 0) return showToast("Cart empty", "error");
            closeCart(); 
            document.getElementById('checkout-modal').style.display = 'flex'; 
        }
        function closeCheckout() { document.getElementById('checkout-modal').style.display = 'none'; }

        function toggleAdmin() {
            const admin = document.getElementById('admin-panel');
            const shop = document.getElementById('shop');
            const filters = document.getElementById('filter-container');
            const grid = document.getElementById('product-grid');

            if (admin.style.display === 'block') {
                admin.style.display = 'none';
                shop.style.display = 'flex';
                filters.style.display = 'flex';
                grid.style.display = 'grid';
            } else {
                renderAdminOrders();
                admin.style.display = 'block';
                shop.style.display = 'none';
                filters.style.display = 'none';
                grid.style.display = 'none';
                window.scrollTo(0,0);
            }
        }

        function showShop() {
            document.getElementById('admin-panel').style.display = 'none';
            document.getElementById('shop').style.display = 'flex';
            document.getElementById('filter-container').style.display = 'flex';
            document.getElementById('product-grid').style.display = 'grid';
            window.scrollTo(0,0);
        }

        function showToast(msg, type='success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.style.borderLeftColor = type === 'error' ? 'red' : '#d4af37';
            toast.innerHTML = `<span>${msg}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.style.opacity='0'; setTimeout(()=>toast.remove(), 300); }, 3000);
        }

        // Close modals on outside click
        window.onclick = function(e) {
            if (e.target == document.getElementById('cart-modal')) closeCart();
            if (e.target == document.getElementById('checkout-modal')) closeCheckout();
        }
        
    </script>
</body>
